<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="{{cssUri}}" />
</head>
<body>
<div class="fullscreen-mechanic fullscreen-mechanic-green">
  <svg class="mechanic-figure" viewBox="0 0 100 160" xmlns="http://www.w3.org/2000/svg">
    <!-- Head (yellow) -->
    <circle cx="50" cy="25" r="18" fill="#FFCC00" stroke="#1a1a1a" stroke-width="2"/>

    <!-- Hard hat (blue) -->
    <path d="M 32 20 Q 32 5, 50 5 Q 68 5, 68 20" fill="#1E90FF" stroke="#1a1a1a" stroke-width="1"/>

    <!-- Eyes -->
    <circle cx="44" cy="23" r="2.5" fill="#1a1a1a"/>
    <circle cx="56" cy="23" r="2.5" fill="#1a1a1a"/>

    <!-- Smile -->
    <path d="M 44 30 Q 50 33, 56 30" stroke="#1a1a1a" stroke-width="2" fill="none" stroke-linecap="round"/>

    <!-- Torso (dark blue with F1 details) -->
    <rect x="30" y="43" width="40" height="35" fill="#1e3a8a" stroke="#1a1a1a" stroke-width="2" rx="2"/>

    <!-- Torso details (racing suit) -->
    <rect x="33" y="46" width="34" height="8" fill="#FF6B35" stroke="#1a1a1a" stroke-width="1"/>
    <circle cx="38" cy="56" r="2" fill="#FFD700"/>
    <circle cx="50" cy="56" r="2" fill="#FFD700"/>
    <circle cx="62" cy="56" r="2" fill="#FFD700"/>
    <rect x="36" y="62" width="5" height="12" fill="#666" stroke="#1a1a1a" stroke-width="0.5"/>
    <rect x="59" y="62" width="5" height="12" fill="#666" stroke="#1a1a1a" stroke-width="0.5"/>

    <!-- Left arm (stationary) -->
    <g id="left-arm">
      <rect x="12" y="48" width="18" height="12" fill="#FFCC00" stroke="#1a1a1a" stroke-width="2" rx="6"/>
      <circle cx="10" cy="54" r="7" fill="#FFCC00" stroke="#1a1a1a" stroke-width="2"/>
    </g>

    <!-- Right arm (waving flag) -->
    <g id="right-arm" class="waving-arm">
      <rect x="70" y="48" width="18" height="12" fill="#FFCC00" stroke="#1a1a1a" stroke-width="2" rx="6"/>
      <circle cx="92" cy="54" r="7" fill="#FFCC00" stroke="#1a1a1a" stroke-width="2"/>

      <!-- Flag pole -->
      <rect x="90" y="30" width="2.5" height="28" fill="#333" stroke="#1a1a1a" stroke-width="1"/>

      <!-- Flag -->
      <g class="flag-wave">
        <rect x="92.5" y="30" width="32" height="20" rx="1" class="mechanic-flag" stroke="#1a1a1a" stroke-width="1.5"/>
      </g>
    </g>

    <!-- Legs (dark blue) -->
    <rect x="40" y="78" width="10" height="22" fill="#1e3a8a" stroke="#1a1a1a" stroke-width="2" rx="1"/>
    <rect x="50" y="78" width="10" height="22" fill="#1e3a8a" stroke="#1a1a1a" stroke-width="2" rx="1"/>

    <!-- Feet (yellow) -->
    <rect x="38" y="100" width="14" height="8" fill="#FFCC00" stroke="#1a1a1a" stroke-width="1.5" rx="1"/>
    <rect x="48" y="100" width="14" height="8" fill="#FFCC00" stroke="#1a1a1a" stroke-width="1.5" rx="1"/>
  </svg>
</div>
<div id="timer-display" style="font-family: 'Courier New', monospace; font-size: 42px; font-weight: bold; margin-top: 20px; text-align: center; color: var(--vscode-foreground); white-space: nowrap;">00 : 00 : 00</div>
<div id="test-controls" style="margin-top: 24px; display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; align-items: center;">
  <label style="font-size: 12px;">Hour:</label>
  <input id="input-hours" type="number" min="0" max="23" value="0" style="width: 50px; padding: 4px; font-size: 12px;">
  <label style="font-size: 12px;">Min:</label>
  <input id="input-minutes" type="number" min="0" max="59" value="0" style="width: 50px; padding: 4px; font-size: 12px;">
  <button id="btn-start-time" style="padding: 8px 16px; font-size: 12px; font-weight: bold;">Start</button>
  <button id="btn-reset-time" style="padding: 8px 16px; font-size: 12px;">Reset</button>
</div>
<audio id="audio-box-box" src="{{boxBoxUri}}" preload="auto" crossorigin="anonymous"></audio>
<script src="{{formatUri}}"></script>
<script src="{{jsUri}}"></script>
</body>
</html>
